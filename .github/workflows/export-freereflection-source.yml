name: Export FreeReflection Source
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source
        run: |
          set -euo pipefail
          rm -rf audit-freereflection
          git clone --depth 1 https://github.com/tiann/FreeReflection.git audit-freereflection
          rm -rf audit-freereflection/.git
          find audit-freereflection -type f -print0 | sort -z | xargs -0 sha256sum > audit-freereflection/SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freereflection-source
          path: audit-freereflection
          if-no-files-found: error
