name: Build Taxi Tripoli APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GODOT_VERSION: 4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Download Godot and export templates
        run: |
          set -euxo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot.zip "$GODOT_URL"
          unzip -tq godot.zip
          unzip -q godot.zip -d godot-bin
          mv "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o templates.tpz "$TEMPLATES_URL"
          unzip -tq templates.tpz
          rm -rf templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Restore fixed test signing key
        run: |
          base64 -d android/fixed_debug_keystore.b64 > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Validate scripts
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Failed to load script|Parse Error" godot-import.log; then
            echo "GDScript validation failed"
            exit 1
          fi

      - name: Import project and export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/Taxi_Tripoli_v1.1.2.apk 2>&1 | tee godot-export.log
          if grep -E "SCRIPT ERROR|Failed to load script|Parse Error" godot-export.log; then
            echo "Export contained script errors"
            exit 1
          fi
          test -s build/Taxi_Tripoli_v1.1.2.apk
          ls -lh build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Tripoli-v1.1.2-APK
          path: build/Taxi_Tripoli_v1.1.2.apk
          if-no-files-found: error
