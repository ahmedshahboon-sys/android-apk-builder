name: Build Shahboun Multi Native

# Stable signing baseline v1
on:
  push:
    branches: [main]
    paths:
      - 'ShahbounMultiProject/**'
      - '.github/workflows/build-shahboun-private-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Shahboun source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable signing material
        uses: actions/cache@v4
        with:
          path: .ci-signing
          key: shahboun-multi-signing-v1

      - name: Create stable signing material if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-signing
          if [ ! -s .ci-signing/shahboun-update.jks ] || [ ! -s .ci-signing/signing.properties ]; then
            PASS=$(openssl rand -hex 24)
            keytool -genkeypair -v \
              -keystore .ci-signing/shahboun-update.jks \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias shahboun-update \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Ahmed Shahboun, OU=Mokarrer Apps, O=Shahboun, L=Tripoli, C=LY"
            printf 'store_password=%s\nkey_password=%s\nkey_alias=shahboun-update\n' "$PASS" "$PASS" > .ci-signing/signing.properties
            chmod 600 .ci-signing/shahboun-update.jks .ci-signing/signing.properties
          fi

      - name: Export signing environment
        shell: bash
        run: |
          set -euo pipefail
          source <(sed 's/^/export /' .ci-signing/signing.properties)
          {
            echo "SHAHBOUN_KEYSTORE=$GITHUB_WORKSPACE/.ci-signing/shahboun-update.jks"
            echo "SHAHBOUN_STORE_PASSWORD=$store_password"
            echo "SHAHBOUN_KEY_PASSWORD=$key_password"
            echo "SHAHBOUN_KEY_ALIAS=$key_alias"
          } >> "$GITHUB_ENV"

      - name: Install Android 16 SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Audit source boundaries
        run: |
          set -euxo pipefail
          cd ShahbounMultiProject
          if grep -R -n -E 'top\.niunaijun|BlackBoxCore|Dobby|Black00Z|jmpews|VirtualApp|VirtualXposed' app/src --include='*.java' --include='*.kt' --include='*.xml'; then
            echo 'Third-party virtualization source reference found'; exit 1
          fi
          if find app -type f \( -name '*.so' -o -name '*.a' -o -name '*.aar' -o -name '*.jar' -o -name '*.dex' \) | grep -q .; then
            echo 'Unexpected prebuilt binary found'; exit 1
          fi

      - name: Build Shahboun APK
        run: |
          set -euxo pipefail
          cd ShahbounMultiProject
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify stable signature and APK
        run: |
          set -euxo pipefail
          APK=$(find ShahbounMultiProject/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK" && test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-signature.txt
          mkdir -p output
          cp "$APK" output/ShahbounMulti.apk
          sha256sum output/ShahbounMulti.apk > output/ShahbounMulti.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs output/ShahbounMulti.apk > output/ShahbounMulti.signature.txt
          unzip -t output/ShahbounMulti.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ShahbounMulti-Native-APK
          path: output/
          if-no-files-found: error
