name: Build Shahboun Multi Native

on:
  push:
    branches: [main, shahboun-multi-runtime-3]
    paths:
      - 'ShahbounMultiProject/**'
      - '.github/workflows/build-shahboun-private-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_CERT_SHA256: 4be48acd1f4a7ac730f7068bb3289c174c283e7ae28c5cc593ec59259ef1de53

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Shahboun source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable signing material
        uses: actions/cache@v4
        with:
          path: .ci-signing
          key: shahboun-multi-signing-v1

      - name: Require the established update key
        shell: bash
        run: |
          set -euo pipefail
          test -s .ci-signing/shahboun-update.jks || { echo 'Stable Shahboun update keystore is missing; refusing to rotate signing identity.'; exit 1; }
          test -s .ci-signing/signing.properties || { echo 'Stable Shahboun signing properties are missing; refusing to rotate signing identity.'; exit 1; }

      - name: Export signing environment safely
        shell: bash
        run: |
          set -euo pipefail
          source <(sed 's/^/export /' .ci-signing/signing.properties)
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "SHAHBOUN_KEYSTORE=$GITHUB_WORKSPACE/.ci-signing/shahboun-update.jks"
            echo "SHAHBOUN_STORE_PASSWORD=$store_password"
            echo "SHAHBOUN_KEY_PASSWORD=$key_password"
            echo "SHAHBOUN_KEY_ALIAS=$key_alias"
          } >> "$GITHUB_ENV"

      - name: Install Android 16 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Audit source boundaries
        run: |
          set -euo pipefail
          cd ShahbounMultiProject
          if grep -R -n -E 'top\.niunaijun|BlackBoxCore|Dobby|Black00Z|jmpews|VirtualApp|VirtualXposed' app/src --include='*.java' --include='*.kt' --include='*.xml'; then
            echo 'Third-party virtualization source reference found'; exit 1
          fi
          if find app -type f \( -name '*.so' -o -name '*.a' -o -name '*.aar' -o -name '*.jar' -o -name '*.dex' \) | grep -q .; then
            echo 'Unexpected prebuilt binary found'; exit 1
          fi

      - name: Build Debug and Release
        run: |
          set -euo pipefail
          cd ShahbounMultiProject
          gradle --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify Release gate and stable certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DEBUG_APK=$(find ShahbounMultiProject/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          RELEASE_APK=$(find ShahbounMultiProject/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          verify_one() {
            local apk="$1" label="$2" out="$3"
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "$out"
            grep -Eq 'Verified using v(2|3) scheme \(APK Signature Scheme v(2|3)\): true' "$out"
            local cert
            cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$out" | head -1 | tr '[:upper:]' '[:lower:]')
            test "$cert" = "$EXPECTED_CERT_SHA256" || { echo "$label certificate changed: $cert"; exit 1; }
            unzip -t "$apk" >/dev/null
          }

          verify_one "$DEBUG_APK" Debug /tmp/debug-signature.txt
          verify_one "$RELEASE_APK" Release /tmp/release-signature.txt

          APKS_DIR="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ -x "$APKS_DIR/apkanalyzer" ]; then
            DEBUGGABLE=$($APKS_DIR/apkanalyzer manifest debuggable "$RELEASE_APK" | tr -d '\r')
            test "$DEBUGGABLE" = "false" || { echo "Release APK is debuggable: $DEBUGGABLE"; exit 1; }
          else
            echo 'apkanalyzer unavailable; checking merged release manifest instead'
            ! grep -R 'android:debuggable="true"' ShahbounMultiProject/app/build/intermediates/merged_manifests/release || exit 1
          fi

          mkdir -p output
          cp "$DEBUG_APK" output/ShahbounMulti-Debug.apk
          cp "$RELEASE_APK" output/ShahbounMulti-Release.apk
          sha256sum output/ShahbounMulti-Debug.apk > output/ShahbounMulti-Debug.apk.sha256
          sha256sum output/ShahbounMulti-Release.apk > output/ShahbounMulti-Release.apk.sha256
          cp /tmp/debug-signature.txt output/ShahbounMulti-Debug.signature.txt
          cp /tmp/release-signature.txt output/ShahbounMulti-Release.signature.txt
          printf '%s\n' "$EXPECTED_CERT_SHA256" > output/expected-certificate.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ShahbounMulti-Native-Debug-Release
          path: output/
          if-no-files-found: error
