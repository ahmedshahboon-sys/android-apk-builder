name: Build Shahboun Multi Native

on:
  push:
    branches: [main]
    paths:
      - 'ShahbounMultiProject/**'
      - '.github/workflows/build-shahboun-private-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Shahboun source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Audit source boundaries
        run: |
          set -euxo pipefail
          cd ShahbounMultiProject
          if grep -R -n -E 'top\.niunaijun|BlackBoxCore|Dobby|Black00Z|jmpews' app/src --include='*.java' --include='*.kt' --include='*.xml'; then
            echo 'Third-party virtualization source reference found'; exit 1
          fi
          if find app -type f \( -name '*.so' -o -name '*.a' -o -name '*.aar' -o -name '*.jar' -o -name '*.dex' \) | grep -q .; then
            echo 'Unexpected prebuilt binary found'; exit 1
          fi

      - name: Build Shahboun APK
        run: |
          set -euxo pipefail
          cd ShahbounMultiProject
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK=$(find ShahbounMultiProject/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK" && test -s "$APK"
          mkdir -p output
          cp "$APK" output/ShahbounMulti.apk
          sha256sum output/ShahbounMulti.apk > output/ShahbounMulti.apk.sha256
          unzip -t output/ShahbounMulti.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ShahbounMulti-Native-APK
          path: output/
          if-no-files-found: error
