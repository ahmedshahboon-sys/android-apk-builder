name: Apply searchable app picker

on:
  push:
    paths:
      - '.github/workflows/apply-picker-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch MainActivity app picker
        shell: python
        run: |
          from pathlib import Path
          p = Path('ShahbounMultiProject/app/src/main/java/com/shahboun/multi/MainActivity.kt')
          s = p.read_text()
          old = '''        val scroll=ScrollView(this).apply{isFillViewport=false;addView(container,ViewGroup.LayoutParams(-1,-2))}
        val dialog=showStyled(MaterialAlertDialogBuilder(this).setTitle("اختر تطبيقًا مثبتًا").setView(scroll).setNegativeButton("إلغاء",null))
        scroll.layoutParams=scroll.layoutParams.apply{height=(resources.displayMetrics.heightPixels*.68f).toInt()}
        rows.forEach{(row,a)->row.setOnClickListener{RuntimeDiagnostics.log("UI","app selected ${a.packageName}");dialog.dismiss();createDialog(a)}}
        dialog.window?.decorView?.let{CairoFontManager.applyTo(it,this)}
'''
          new = '''        val scroll=ScrollView(this).apply{isFillViewport=false;addView(container,ViewGroup.LayoutParams(-1,-2))}
        val search=TextInputEditText(this).apply{
            hint="ابحث باسم التطبيق أو الحزمة"
            setSingleLine(true);setTextColor(textPrimary);setHintTextColor(textSecondary);typeface=arabicBody
            gravity=Gravity.CENTER_VERTICAL or Gravity.END;layoutDirection=View.LAYOUT_DIRECTION_RTL
            background=rounded(surface2,14,Color.rgb(48,43,62));setPadding(dp(14),0,dp(14),0)
        }
        val noResults=tv("ما فيش نتائج مطابقة",13f,1,textSecondary).apply{gravity=Gravity.CENTER;visibility=View.GONE;setPadding(0,dp(16),0,dp(10))}
        val pickerRoot=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;layoutDirection=View.LAYOUT_DIRECTION_RTL;setPadding(dp(8),dp(4),dp(8),0)}
        pickerRoot.addView(search,LinearLayout.LayoutParams(-1,dp(50)).apply{setMargins(0,0,0,dp(8))})
        pickerRoot.addView(noResults,LinearLayout.LayoutParams(-1,-2))
        pickerRoot.addView(scroll,LinearLayout.LayoutParams(-1,0,1f))
        val dialog=showStyled(MaterialAlertDialogBuilder(this).setTitle("اختر تطبيقًا مثبتًا").setView(pickerRoot).setNegativeButton("إلغاء",null))
        pickerRoot.layoutParams=pickerRoot.layoutParams.apply{height=(resources.displayMetrics.heightPixels*.72f).toInt()}
        search.addTextChangedListener(object:android.text.TextWatcher{
            override fun beforeTextChanged(s:CharSequence?,start:Int,count:Int,after:Int){}
            override fun onTextChanged(s:CharSequence?,start:Int,before:Int,count:Int){
                val q=s?.toString()?.trim()?.lowercase().orEmpty();var shown=0
                rows.forEach{(row,a)->val match=q.isBlank()||a.label.lowercase().contains(q)||a.packageName.lowercase().contains(q);row.visibility=if(match)View.VISIBLE else View.GONE;if(match)shown++}
                noResults.visibility=if(shown==0)View.VISIBLE else View.GONE
            }
            override fun afterTextChanged(s:android.text.Editable?){}
        })
        rows.forEach{(row,a)->row.setOnClickListener{RuntimeDiagnostics.log("UI","app selected ${a.packageName}");dialog.dismiss();createDialog(a)}}
        dialog.window?.decorView?.let{CairoFontManager.applyTo(it,this)}
'''
          if old not in s:
              raise SystemExit('picker block not found; source changed')
          p.write_text(s.replace(old,new,1))
      - name: Commit picker search
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ShahbounMultiProject/app/src/main/java/com/shahboun/multi/MainActivity.kt
          git commit -m 'Add search to installed app picker'
          git push
# one-shot migration trigger
