name: Build Shahboun Multi Modern V2

on:
  push:
    branches: [main, shahboun-multi-runtime-3]
    paths:
      - 'ShahbounMultiProject/**'
      - '.github/workflows/build-shahboun-multi-modern-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_CERT_SHA256: 4be48acd1f4a7ac730f7068bb3289c174c283e7ae28c5cc593ec59259ef1de53

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore established Shahboun update key
        uses: actions/cache@v4
        with:
          path: .ci-signing
          key: shahboun-multi-signing-v1
      - name: Require stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -s .ci-signing/shahboun-update.jks || { echo 'Stable Shahboun update keystore is missing; refusing to build with a different key.'; exit 1; }
          test -s .ci-signing/signing.properties || { echo 'Stable Shahboun signing properties are missing; refusing to build with a different key.'; exit 1; }
          source <(sed 's/^/export /' .ci-signing/signing.properties)
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "SHAHBOUN_KEYSTORE=$GITHUB_WORKSPACE/.ci-signing/shahboun-update.jks"
            echo "SHAHBOUN_STORE_PASSWORD=$store_password"
            echo "SHAHBOUN_KEY_PASSWORD=$key_password"
            echo "SHAHBOUN_KEY_ALIAS=$key_alias"
          } >> "$GITHUB_ENV"
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
      - name: Verify no external clone engine code
        run: |
          set -euo pipefail
          if grep -R -n -E 'BlackBox|Black00Z|Dobby|VirtualApp|VirtualXposed|niunaijun' ShahbounMultiProject --exclude-dir=build; then
            echo 'External clone engine reference found'; exit 1
          fi
          if find ShahbounMultiProject/app -type f \( -name '*.so' -o -name '*.aar' -o -name '*.jar' -o -name '*.dex' \) | grep -q .; then
            echo 'Prebuilt engine binary found in Shahboun project'; exit 1
          fi
      - name: Build Shahboun-owned APK
        run: |
          set +e
          gradle -p ShahbounMultiProject :app:assembleDebug --stacktrace 2>&1 | tee /tmp/shahboun-build.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            mkdir -p dist
            tail -n 350 /tmp/shahboun-build.log > dist/shahboun-build-error.txt
            exit "$RC"
          fi
      - name: Verify stable certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find ShahbounMultiProject/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/shahboun-signature.txt
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/shahboun-signature.txt | head -1 | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "$EXPECTED_CERT_SHA256" || { echo "Signing certificate changed: $CERT"; exit 1; }
      - name: Package APK
        run: |
          set -euo pipefail
          APK=$(find ShahbounMultiProject/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK" && test -s "$APK"
          cp "$APK" ShahbounMulti-Modern.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShahbounMulti-Modern-V2-APK
          path: ShahbounMulti-Modern.apk
          if-no-files-found: error
