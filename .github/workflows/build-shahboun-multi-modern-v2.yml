name: Build Shahboun Multi Modern V2

on:
  push:
    branches: [main]
    paths:
      - 'ShahbounMultiProject/**'
      - '.github/workflows/build-shahboun-multi-modern-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
      - name: Verify no external clone engine code
        run: |
          set -euo pipefail
          if grep -R -n -E 'BlackBox|Black00Z|Dobby|VirtualApp|VirtualXposed|niunaijun' ShahbounMultiProject --exclude-dir=build; then
            echo 'External clone engine reference found'; exit 1
          fi
          if find ShahbounMultiProject/app -type f \( -name '*.so' -o -name '*.aar' -o -name '*.jar' -o -name '*.dex' \) | grep -q .; then
            echo 'Prebuilt engine binary found in Shahboun project'; exit 1
          fi
      - name: Build Shahboun-owned APK
        run: |
          set +e
          gradle -p ShahbounMultiProject :app:assembleDebug --stacktrace 2>&1 | tee /tmp/shahboun-build.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            mkdir -p dist
            tail -n 350 /tmp/shahboun-build.log > dist/shahboun-build-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/shahboun-build-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "Capture Shahboun build error [skip ci]"
              git push origin HEAD:main
            fi
            exit "$RC"
          fi
      - name: Package APK
        run: |
          set -euo pipefail
          APK=$(find ShahbounMultiProject/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK" && test -s "$APK"
          cp "$APK" ShahbounMulti-Modern.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShahbounMulti-Modern-V2-APK
          path: ShahbounMulti-Modern.apk
          if-no-files-found: error
      - name: Publish APK
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p dist
          cp ShahbounMulti-Modern.apk dist/ShahbounMulti-Modern.apk
          sha256sum dist/ShahbounMulti-Modern.apk > dist/ShahbounMulti-Modern.apk.sha256
          rm -f dist/shahboun-build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ShahbounMulti-Modern.apk dist/ShahbounMulti-Modern.apk.sha256
          git add -u dist/shahboun-build-error.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publish Shahboun Multi Modern V2 APK [skip ci]"
            git push origin HEAD:main
          fi
