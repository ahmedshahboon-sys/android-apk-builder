name: Build Shahboun Multi Modern V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: bash scripts/build_shahboun_modern.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShahbounMulti-Modern-V2-APK
          path: ShahbounMulti-Modern.apk
          if-no-files-found: error
      - name: Publish APK
        run: |
          mkdir -p dist
          cp ShahbounMulti-Modern.apk dist/ShahbounMulti-Modern.apk
          sha256sum dist/ShahbounMulti-Modern.apk > dist/ShahbounMulti-Modern.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ShahbounMulti-Modern.apk dist/ShahbounMulti-Modern.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish Shahboun Multi Modern V2 APK [skip ci]"
            git push
          fi
