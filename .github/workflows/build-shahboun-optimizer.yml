name: Build Shahboun Optimizer APK

on:
  push:
    branches: [ main ]
    paths:
      - 'ShahbounOptimizer/**'
      - '.github/workflows/build-shahboun-optimizer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        working-directory: ShahbounOptimizer
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p output
          cp ShahbounOptimizer/app/build/outputs/apk/debug/app-debug.apk output/Shahboun-Optimizer-v1.1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shahboun-Optimizer-v1.1.0-APK
          path: output/Shahboun-Optimizer-v1.1.0.apk
          if-no-files-found: error
          retention-days: 30
