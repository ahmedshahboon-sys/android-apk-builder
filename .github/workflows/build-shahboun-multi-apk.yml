name: Build Shahboun Multi APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-shahboun-multi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -1); fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
      - name: Restore Shahboun Multi source
        run: |
          cat > /tmp/ShahbounMulti.zip.b64 <<'B64EOF'

B64EOF
          base64 -d /tmp/ShahbounMulti.zip.b64 > /tmp/ShahbounMulti.zip
          unzip -q -o /tmp/ShahbounMulti.zip -d "$GITHUB_WORKSPACE"
          test -f ShahbounMulti/settings.gradle.kts
      - name: Build debug APK
        run: |
          gradle -p ShahbounMulti --no-daemon :app:assembleDebug
          test -s ShahbounMulti/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShahbounMulti-Development-APK
          path: ShahbounMulti/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to repository
        run: |
          mkdir -p dist
          cp ShahbounMulti/app/build/outputs/apk/debug/app-debug.apk dist/ShahbounMulti.apk
          sha256sum dist/ShahbounMulti.apk > dist/ShahbounMulti.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ShahbounMulti.apk dist/ShahbounMulti.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish Shahboun Multi APK [skip ci]"
            git push
          fi
