name: Build Shahboun Multi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -1); fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;29.0.13846066"

      - name: Fetch Android 16 compatible virtualization engine
        run: |
          rm -rf /tmp/ShahbounMultiEngine
          git clone --depth 1 https://github.com/Black00Z/Blacks-BlackBox.git /tmp/ShahbounMultiEngine
          cd /tmp/ShahbounMultiEngine
          chmod +x gradlew

      - name: Apply Shahboun Multi Arabic identity
        run: |
          cd /tmp/ShahbounMultiEngine
          python3 - <<'PY'
          from pathlib import Path

          # Keep the proven virtualization engine intact; localize user-facing resources only.
          replacements = {
            "Black's BlackBox":"Shahboun Multi",
            "Setting":"الإعدادات",
            "Settings":"الإعدادات",
            "Installed App":"التطبيقات المثبتة",
            "Installed Apps":"التطبيقات المثبتة",
            "CHOOSE":"اختيار",
            "Choose":"اختيار",
            "Fake Location(Preview)":"الموقع الوهمي (تجريبي)",
            "Fake Location":"الموقع الوهمي",
            "Device Spoofing":"تغيير هوية الجهاز",
            "Black's BlackBox Gallery":"معرض Shahboun Multi",
            "GMS Manager":"إدارة خدمات Google",
            "Go to Gms Manager":"فتح إدارة خدمات Google",
            "Hide Root":"إخفاء الروت",
            "Daemon":"خدمة الخلفية",
            "Use VPN Network":"استخدام شبكة VPN",
            "VPN mode is not supported on Android 14+":"وضع VPN غير مدعوم على Android 14 فما فوق",
            "Disable Flag Secure":"السماح بلقطات الشاشة",
            "Allow screenshots and screen recording in apps":"السماح بلقطات الشاشة وتسجيل الشاشة داخل التطبيقات",
            "Dark mode":"الوضع الداكن",
            "Use a dark theme for the host UI":"استخدام المظهر الداكن لواجهة التطبيق",
            "Fallback for Some Apps":"وضع التوافق لبعض التطبيقات",
            "Allows the host to communicate with Black's BlackBox":"يسمح للتطبيق الرئيسي بالتواصل مع بيئة Shahboun Multi",
            "Freeze App instantly":"تجميد التطبيق فورًا",
            "Adds a small freeze button to running apps.":"إضافة زر صغير لتجميد التطبيقات أثناء التشغيل.",
            "Send Logs":"إرسال سجل الأخطاء",
            "Create a debug log and share it with any app":"إنشاء سجل تشخيص ومشاركته مع أي تطبيق",
            "About":"حول التطبيق",
            "Author and maintainer":"المطور والمشرف",
            "Tap to open source":"اضغط لفتح المصدر",
            "Build Note":"ملاحظات البناء",
            "Made with Legacy Code and AI.":"تم تطوير هذه النسخة اعتمادًا على الشفرة الأصلية مع تحسينات برمجية.",
            "Others":"أخرى",
            "Automatic freezing is turned off":"التجميد التلقائي متوقف",
            "Activate auto-freeze?":"تفعيل التجميد التلقائي؟",
            "ENABLE":"تفعيل",
            "CANCEL":"إلغاء",
            "Enable":"تفعيل",
            "Cancel":"إلغاء",
            "User ":"المستخدم ",
          }

          for p in Path('app/src/main/res').rglob('*.xml'):
              try: s=p.read_text(encoding='utf-8')
              except: continue
              old=s
              for a,b in replacements.items(): s=s.replace(a,b)
              if s != old: p.write_text(s,encoding='utf-8')

          # Force Arabic/RTL for the host UI without touching cloned applications.
          manifest=Path('app/src/main/AndroidManifest.xml')
          s=manifest.read_text(encoding='utf-8')
          if 'android:supportsRtl=' not in s:
              s=s.replace('<application', '<application android:supportsRtl="true"')
          manifest.write_text(s,encoding='utf-8')

          # Arabic app name, including any escaped variant in strings.xml.
          p=Path('app/src/main/res/values/strings.xml')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace("Black\\'s BlackBox", "Shahboun Multi").replace("Black's BlackBox", "Shahboun Multi")
              p.write_text(s,encoding='utf-8')

          Path('settings.gradle').write_text('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://www.jitpack.io" }
                  maven { url "https://maven.aliyun.com/repository/releases" }
                  maven { url "https://maven.aliyun.com/repository/public" }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://www.jitpack.io" }
                  maven { url "https://maven.aliyun.com/repository/releases" }
                  maven { url "https://maven.aliyun.com/repository/public" }
              }
          }
          rootProject.name = "NewBlackbox"
          include ':app'
          include ':blackbox-gallery-stub'
          include ':black-reflection'
          include ':compiler'
          include ':Bcore'
          ''', encoding='utf-8')
          PY

      - name: Build functional APK
        run: |
          cd /tmp/ShahbounMultiEngine
          ./gradlew --no-daemon :app:assembleDebug
          APK=$(find app/build/outputs/apk/debug -type f -name '*universal*.apk' | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1); fi
          test -n "$APK"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ShahbounMulti.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShahbounMulti-Arabic-APK
          path: ShahbounMulti.apk
          if-no-files-found: error

      - name: Publish APK to repository
        run: |
          mkdir -p dist
          cp ShahbounMulti.apk dist/ShahbounMulti.apk
          sha256sum dist/ShahbounMulti.apk > dist/ShahbounMulti.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ShahbounMulti.apk dist/ShahbounMulti.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish Arabic Shahboun Multi APK [skip ci]"
            git push
          fi
